services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bar
      POSTGRES_PASSWORD: bar
      POSTGRES_DB: bar
    ports:
      - '5432:5432'
    volumes:
      - bar-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  bar-postgres:
