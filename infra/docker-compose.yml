services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bar
      POSTGRES_PASSWORD: bar
      POSTGRES_DB: bar
    ports:
      - '5432:5432'
    volumes:
      - bar-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ['sonar']
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs

  sonarqube-db:
    image: postgres:16-alpine
    profiles: ['sonar']
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bar-postgres:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-db:
