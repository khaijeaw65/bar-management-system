      </div>

            <span style="font: var(--fw-bold) var(--fs-body)/1.3 var(--font-numeric); color: var(--text-accent); font-variant-numeric: tabular-nums">{{r.price}}</span>

      <div style="position: absolute; inset: 0; z-index: 10; background: var(--scrim); backdrop-filter: var(--blur-overlay)"></div>
      <div role="alertdialog" aria-labelledby="leave-t" style="position: absolute; left: 24px; right: 24px; top: 300px; z-index: 11; box-sizing: border-box; padding: 20px; border-radius: var(--r-card); background: var(--surface-overlay); border: 1px solid var(--line); box-shadow: var(--shadow-raised); display: flex; flex-direction: column; gap: 12px">

          <span id="leave-t" style="font: var(--text-heading)">ยกเลิกตะกร้า?</span>

        <div style="font: var(--text-body-md); color: var(--text-muted)">รายการในตะกร้าจะไม่ถูกส่ง</div>
        <div style="display: flex; gap: 8px; margin-top: 4px">
          <div style="flex: 1 1 0; display: flex">
            <x-import component-from-global-scope="TheLoftBarDesignSystem_99bbff.Button" variant="secondary" size="lg" block="{{yes}}">อยู่ต่อ</x-import>
          </div>
          <div style="flex: 1 1 0; display: flex">
            <x-import component-from-global-scope="TheLoftBarDesignSystem_99bbff.Button" variant="danger" size="lg" block="{{yes}}" icon-left="trash-2">ทิ้งตะกร้า</x-import>
          </div>
        </div>
      </div>
    </div>
