# field-kit CI (G2). Ruleset main-ci requires the status check named `ci` — the last job aggregates the others.
name: ci

on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bar
          POSTGRES_PASSWORD: bar
          POSTGRES_DB: bar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bar -d bar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBO_TELEMETRY_DISABLED: 1
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: bar
      PGPASSWORD: bar
      PGDATABASE: bar
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-jwt-access-secret-32-characters
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: "7"
      LINE_CHANNEL_ID: line-channel-test
      LINE_CHANNEL_SECRET: line-channel-secret-test
      LINE_CALLBACK_URL: http://localhost:3001/api/auth/line/callback
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Affected lint, typecheck, test
        run: pnpm turbo run lint typecheck test --filter="...[origin/main]"

      # ponytail: one job, so Postgres always starts. test:e2e runs only when
      # @bar/backend is in the affected set. turbo.json has no test:e2e task.
      - name: Backend e2e when affected
        run: |
          set -euo pipefail
          dry=$(pnpm exec turbo run lint typecheck test --filter="...[origin/main]" --dry=json)
          if printf '%s\n' "$dry" | jq -e 'any(.packages[]?; . == "@bar/backend")' >/dev/null; then
            echo "test:e2e @bar/backend against postgres://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
            pnpm --filter @bar/backend test:e2e
          else
            echo "Skipping test:e2e — @bar/backend is not affected"
          fi

      - name: OpenAPI spec matches contracts
        run: |
          set -euo pipefail
          dry=$(pnpm exec turbo run lint typecheck test --filter="...[origin/main]" --dry=json)
          if printf '%s\n' "$dry" | jq -e 'any(.packages[]?; . == "@bar/backend" or . == "@bar/contracts")' >/dev/null; then
            pnpm --filter @bar/backend openapi:export
            git diff --exit-code docs/api/openapi.json
          else
            echo "Skipping openapi:export — backend and contracts are not affected"
          fi

  lock:
    runs-on: ubuntu-latest
    env:
      # Briefs seeded before workflow Rev 24 (Cowork-seeded e2e, no lock commit) finish under Rev 23 — skip the lock check.
      # Remove an ID once its PR is merged; delete the list when it is empty.
      LEGACY_BRIEFS: 'BRIEF-010 BRIEF-022 BRIEF-059 BRIEF-060 BRIEF-062 BRIEF-065 BRIEF-900'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Acceptance lock
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ID=$(printf '%s' "$BRANCH" | grep -oE 'BRIEF-[0-9]+' | head -n1 || true)
          if [ -n "$ID" ] && printf ' %s ' "$LEGACY_BRIEFS" | grep -q " $ID "; then
            echo "lock: skip — $ID was seeded before Rev 24 (workflow §9 transition)"; exit 0
          fi
          bash scripts/field-kit/check-lock.sh

  ci:
    if: always()
    needs: [checks, lock]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.lock.result }}" = success ] || exit 1
